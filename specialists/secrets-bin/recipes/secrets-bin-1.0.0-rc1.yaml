# secrets-bin 1.0.0 release candidate (superseded by secrets-bin-1.0.0.yaml, the recipe of the released model): the
# binary generator on a corpus of real binaries, the n-gram memory
# (`tiny_n18`: orders 2-4, 2^18 buckets, 50 M table parameters, 28.8 MiB at 4 bits), and REAL negative windows from
# Windows PE files in every batch (real_mode: neg), which cut false alarms on PE files by about fifty times.
# About one seed in six can end with many times the false alarms of the others: judge it on SIX seeds and read the MAX.
name: secrets-bin
version: 1.0.0-rc1
specialist: secrets-bin
task_type: tag
output_schema:
  labels: [secret]
  per_byte: true
  min_select_recall: 0.60
  bias_policy: conservative
data:
  format: secrets_synthetic
  path: ${PUREBYTE_DATA}/corpora/binary-context.bin    # data/build_binary_corpus.py
  version: v4
  split_policy: {unit: corpus_range, seed: 0, train_frac: 0.8, select_frac: 0.1, test_frac: 0.1}
  n_train: 40000
  n_eval: 2000
  seq_len: 512
  control: shuffled_spans
  extra_lines: 5
  web_negatives: true
  nul_separator: true              # 70 % of the blocks between NULs, like a C string table
  bare_value: true                 # sometimes the value alone, when it is decidable by itself
  long_hex: true
train:
  seeds: [0, 1, 2, 3, 4, 5]
  mode: causal
  size: tiny_n18
  steps: 6000
  lr: 0.001
  batch: 16
  real_windows: ${PUREBYTE_DATA}/streams/pe-negatives.npz   # data/ scripts (public Windows binaries)
  real_frac: 0.25
  real_mode: neg
  decide: true
criteria:
  written: 2026-09-23
  prediction: "synthetic probe recall >= 0.99; false alarms on real shared objects: mean <= 15 with no seed >= 50"
  synthetic:
    - {metric: control_f1, op: "<=", value: 0.05}
  exams:
    - {exam: bin-fp-a, metric: findings_mean_seed, op: "<=", value: 15}
    - {exam: bin-fp-a, metric: findings_max_seed, op: "<", value: 50, why: "the seed tail: read the max"}
    - {exam: bin-fp-b, metric: pe_findings_mean_seed, op: "<=", value: 20}
exams: [bin-fp-a, bin-fp-b, bin-fp-c]
engine:
  threads: 1
