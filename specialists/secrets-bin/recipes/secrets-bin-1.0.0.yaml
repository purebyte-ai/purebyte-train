# secrets-bin 1.0.0 -- the recipe of the released model. Six seeds are trained; the released one is the best on
# `select` (seed 1), chosen by the factory's rule before any exam was read. One model, no ensemble.
#
# The binary generator on a corpus of real binaries, the n-gram memory (`tiny_n18`: orders 2-4, 2^18 buckets, 50 M table
# parameters, exported at 4 bits), and REAL negative windows in every batch (`real_mode: neg`, 45 % of the batch size):
# 78,283 windows of 512 bytes from Windows executables and libraries, from files of other binary formats (JAR, APK,
# PYC, WebAssembly, Mach-O, Node addons, firmware, ar archives, object files, ELF and PE) and from compiled Python
# extension modules of 63 packages, none of them an exam file (the extension modules of 18 more packages were held out
# as an exam). Those binaries come from the machine the model was trained on and many cannot be redistributed: the
# builder of the stream is not in this repository yet (TBD), and a retraining with another negative pool is expected to
# land close in quality, not bit for bit. `out_lr_mult: 0.25` scales the learning rate of every `out_proj` down: without
# it, about one seed in six ended with many times the false alarms of the others on real binaries.
#
#   pbtrain run specialists/secrets-bin/recipes/secrets-bin-1.0.0.yaml --device cuda --parallel 3
name: secrets-bin
version: 1.0.0
specialist: secrets-bin
task_type: tag
output_schema:
  labels: [secret]
  per_byte: true
  min_select_recall: 0.60
  bias_policy: conservative
data:
  format: secrets_synthetic
  path: ${PUREBYTE_DATA}/corpora/binary-context.bin    # data/build_binary_corpus.py
  version: v4
  split_policy: {unit: corpus_range, seed: 0, train_frac: 0.8, select_frac: 0.1, test_frac: 0.1}
  n_train: 40000
  n_eval: 2000
  seq_len: 512
  control: shuffled_spans
  extra_lines: 5
  web_negatives: true
  nul_separator: true              # 70 % of the blocks between NULs, like a C string table
  bare_value: true                 # sometimes the value alone, when it is decidable by itself
  long_hex: true
train:
  seeds: [0, 1, 2, 3, 4, 5]
  mode: causal
  size: tiny_n18
  steps: 6000
  lr: 0.001
  batch: 16
  real_windows: ${PUREBYTE_DATA}/streams/binary-negatives.npz
  real_frac: 0.45
  real_mode: neg
  out_lr_mult: 0.25
  decide: true
criteria:                          # pre-registered: written before this version was trained; counts on files that hold
  written: 2026-09-23              # no credential (every finding is a false alarm)
  prediction: "pays; bin-fp-a mean 5-10 with max <= 20; PE files of bin-fp-b 10-20; bin-fp-c 15-25"
  exams:
    - {exam: bin-fp-a, metric: findings_mean_seed, op: "<=", value: 10}
    - {exam: bin-fp-a, metric: findings_max_seed, op: "<=", value: 25, why: "the seed tail: read the max"}
    - {exam: bin-fp-b, metric: pe_findings_mean_seed, op: "<=", value: 20}
    - {exam: bin-fp-b, metric: elf_findings_mean_seed, op: "<=", value: 10}
    - {exam: bin-fp-c, metric: findings_mean_seed, op: "<=", value: 25}
    - {exam: bin-pyext, metric: findings_mean_seed, op: "<=", value: 1.17, why: "half the previous candidate's mean (2.33) on 60 held-out extension modules, measured in the same run"}
    - {exam: bin-probe, metric: recall_min_seed, op: ">=", value: 0.99, why: "360 decidable credentials planted in real binaries"}
# Outcome (six seeds): every false-alarm criterion PASSES (means 2.7 / max 6, 13.2, 3.5, 13.0, 0.83); the probe criterion
# FAILS for two seeds (recall 0.989: 4 of 360 missed); the released seed 1 has recall 1.000 there. Released with that
# FAIL (benchmarks/RESULTS.md#the-pre-registered-criteria-of-secrets-bin in the runtime repository). Conditions: the
# six seeds were measured by the maintainers' research code (n-gram tables at 32 bits), without the 10 exam files that
# overlap the earlier binary corpus. `bin-pyext` and `bin-probe` are private exams declared nowhere in data/exams/, the
# probe is synthetic (credentials from the training generator: in-distribution recall), and the per-seed metrics and
# the PE / ELF split of bin-fp-b come from tooling that is not in this repository yet (TBD): count_findings.py counts
# the files of one release, and a release of this specialist holds one model.
exams: [bin-fp-a, bin-fp-b, bin-fp-c]
engine:
  threads: 1
