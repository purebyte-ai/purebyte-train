# secrets-code 1.1.0 CANDIDATE -- the recipe of the FIRST release candidate with ONE change: lr 3e-4. Measured with
# three seeds it lowered the false alarms on the clean-repository exam by about a quarter with the same recall on the
# synthetic battery; three seeds INFORM, so this candidate trains SIX and is judged on the exams below before any
# release. Superseded: the released 1.0.0 (secrets-code-1.0.0.yaml) already trains at lr 3e-4, with more generator
# families and real windows. Versions before the public 1.0.0 were numbered on their own: the "1.0.0 (0.462)" that the
# criteria below quote is that FIRST internal candidate, not the released model (CredData TEST F1 0.797).
name: secrets-code
version: 1.1.0-rc1
specialist: secrets-code
task_type: tag
output_schema:
  labels: [secret]
  per_byte: true
  min_select_recall: 0.60
  bias_policy: conservative
data:
  format: secrets_synthetic
  path: ${PUREBYTE_DATA}/corpora/code-context.bin
  version: v4
  split_policy: {unit: corpus_range, seed: 0, train_frac: 0.8, select_frac: 0.1, test_frac: 0.1}
  n_train: 80000
  n_eval: 2000
  seq_len: 512
  control: shuffled_spans
  extra_lines: 5
  real_neighbors: true
  web_negatives: true
  shared_hosts: true
  connection_config: 0.08
  short_passwords: 0.2
  ordinary_short_values: separate
  reinforced_forms: 0.05
  non_assignment_weight: 35
  nested_weight: 8
train:
  seeds: [0, 1, 2, 3, 4, 5]
  mode: causal
  size: nano
  steps: 12000
  lr: 0.0003
  batch: 16
  decide: true
criteria:
  written: 2026-09-23
  prediction: "same synthetic F1 as 1.0.0; fewer false alarms on code-fp-b; CredData TEST F1 of the ensemble >= 1.0.0"
  synthetic:
    - {metric: test_f1_mean, op: ">=", value: 0.89}
    - {metric: control_f1, op: "<=", value: 0.05}
  exams:
    - {exam: creddata-test, metric: f1_ensemble, op: ">=", value: 0.462, why: "must not lose to 1.0.0 (0.462)"}
    - {exam: code-fp-b, metric: findings_max_seed, op: "<=", value: 129, why: "no seed worse than 1.2 x 1.0.0"}
    - {exam: code-fp-b, metric: findings_ensemble, op: "<=", value: 89}
exams: [creddata-test, code-fp-a, code-fp-b, code-fp-c]
engine:
  threads: 1
