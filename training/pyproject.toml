[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pbtrain"
version = "0.1.0"
description = "PureByte training stack: specialists from a task file to a released GGUF"
license = "Apache-2.0"
requires-python = ">=3.10"
# PyTorch 2.2 and 2.3 were built against NumPy 1.x; the last PyTorch for Intel Macs is 2.2, so there NumPy stays below 2.
dependencies = [
  "numpy>=1.24",
  "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch>=2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyyaml>=6", "scikit-learn>=1.2",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pbtrain = "pbtrain.cli:main"

[tool.setuptools.packages.find]
include = ["pbtrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
