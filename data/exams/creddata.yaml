# CredData (Samsung/CredData): 337 public repositories with every credential-like line labeled by hand. Only the
# labeled files are downloaded (by FileID, as CredData's own `download_data.py` selects them) and they are OBFUSCATED by
# CredData's own `obfuscate_creds.py` (real values are replaced; nothing here or in the dataset holds a live credential).
#
#   python data/fetch_creddata.py             -> $PUREBYTE_DATA/exams/creddata/CredData/ (checkout + data/ + meta/)
#                                                 $PUREBYTE_DATA/exams/creddata/split.json
#   python data/fingerprint_exams.py --set creddata-test --set creddata-dev
#
# The split is by repository and is computed EXACTLY like the public scorer, by importing
# benchmarks/creddata/score.py (seed 20260922, pairs of repositories sorted by positive units, seeded coin). The lists
# below are what that computation gives for the pinned snapshot; fetch_creddata.py recomputes it and stops if the two
# ever differ. TEST is never used for training, and operating points are never chosen on it; one release choice was
# made with TEST scores in view: the released seed of secrets-code 1.0.0 was chosen on code-fp-b while the CredData
# TEST F1 of its three seeds was known (the runtime's benchmarks/RESULTS.md says so where it happened). DEV may be used
# for tuning (it is where operating points are chosen), so its fingerprints carry `role: dev` and the training factory
# decides what to do with them; the context corpora exclude both.
#
# Every upstream repository below is also an identity key: none of them may appear in data/sources/*.yaml.
schema: 1
kind: exam
name: creddata
description: CredData, labelled credential lines in 337 public repositories, split by repository into DEV and TEST.
sets:
  - name: creddata-test
    role: test
    fingerprint: creddata
    description: "CredData TEST: the half of the repositories that no released model is trained on (one release choice was made with its scores in view: see the header)."
