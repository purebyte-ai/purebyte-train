# False-alarm exams for the text model: public repositories that hold no real credential, so every finding on them is a
# false alarm. They are ONLY scanned and counted, never read to design training data, and nothing from them may reach a
# training corpus (identity check on the repository URL, content check on 64-byte blocks).
#
#   python data/fetch_exams.py --set code-fp-a      -> $PUREBYTE_DATA/exams/code-fp-a/<repo>/...   (exact committed bytes)
#   python data/fingerprint_exams.py --set code-fp-a -> $PUREBYTE_DATA/exams/fingerprints/code-fp-a.npz
#
# Every file of every repository at the pinned commit is fingerprinted (any size, any type).
schema: 1
kind: exam
name: code-fp
description: Repositories without credentials, scanned to count false alarms of the text model.
sets:
  - name: code-fp-a
    role: test
    description: Six web frameworks and HTTP libraries (Python, Go, JavaScript, Ruby, Java).
    entries:
      - {id: urllib3, type: git, url: https://github.com/urllib3/urllib3, pin: {commit: 09217b75d51f3c74d089b587f1be813b6bdfc7d7}, licence: MIT}
      - {id: chi, type: git, url: https://github.com/go-chi/chi, pin: {commit: 3d1777a1ef8881f7d1da0b02c76ca8f0a29cd2bc}, licence: MIT}
      - {id: fastify, type: git, url: https://github.com/fastify/fastify, pin: {commit: 630acd0b6cf8a91322ff05c3d95feb991091866d}, licence: MIT}
