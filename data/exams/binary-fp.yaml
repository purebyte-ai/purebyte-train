# False-alarm exams for the binary model: real binaries that hold no credential, so every finding on them is a false
# alarm. Evaluation only: nothing from them may reach a training corpus (identity check on package+version, URL and
# the sha256 of every file below; content check on 64-byte blocks).
#
#   python data/fetch_exams.py --set bin-fp-a            downloads the public artifacts, extracts and verifies the files
#   python data/fetch_exams.py --set bin-fp-b --from-dir DIR   files without a public download come from a local copy
#   python data/fingerprint_exams.py --set bin-fp-a ...
#
# Every file is listed with its sha256 and size. When the file comes from a public artifact, the artifact is pinned
# (PyPI / Maven Central / NuGet / Debian-format archive / vendor download) and the file's path inside it is given;
# `pin.verify: members` marks an artifact whose own digest is not published: the listed members are what is verified.
# Files with no public download (`type: local`) are identified by sha256 and size only; their bytes are never
# distributed, and their fingerprints are built from a local copy (`--from-dir`); without one, the fingerprint file of
# the set says it is incomplete (15 files of bin-fp-b and 46 of bin-fp-c).
# The Ubuntu packages below are zstd-compressed: extracting them needs Python 3.14+ or the `zstd` command.
#
# CORRECTION of 2026-09-25 (bin-fp-c). Two npm members were first pinned with the sha256 and size of the builds that
# desktop applications bundle under the same package name and version, not with those of the files npm publishes, so
# the download of the set stopped on them. They now pin the published files, checked on 2026-09-25 against the npm
# tarballs (whose SHA-512 the registry publishes; the three tarballs are now pinned by sha256 too):
#   rollup.win32-x64-msvc.node (@rollup/rollup-win32-x64-msvc 4.54.0):
#       2,576,896 -> 2,575,872 bytes, sha256 d4c548242da1... -> e1cecdc58667...
#   zeromq_node.napi.glibc.node (zeromq 6.0.0-beta.16, prebuilds/win32-x64/node.napi.glibc.node):
#       927,264 -> 644,608 bytes, sha256 be15e32b21e0... -> 59e0dcada07b...
# The bin-fp-c figures published for secrets-bin 1.0.0 (the runtime's benchmarks/RESULTS.md) were measured on the
# earlier, application-bundled copies. None of the findings published there is in these two files, and the released
# model reports nothing on the npm-published copies either (scanned on 2026-09-25 with every span reported).
schema: 1
kind: exam
name: binary-fp
description: Binaries without credentials, scanned to count false alarms of the binary model.
