# Credential-format catalogs for the secrets generators, derived from two public scanners. They hold credential-like
# example strings from the scanners' own tests, so they are built into $PUREBYTE_DATA/catalogs/ and never committed.
#
#   python data/build_secret_catalogs.py   -> $PUREBYTE_DATA/catalogs/gitleaks.json, trufflehog.json, catalogs.manifest.json
#
#   gitleaks.json    {"rules": [{"id", "regex", "kw": [keywords]}], "tps": [...], "fps": [...]}
#                    rules from config/gitleaks.toml; tps / fps: the literal elements of the `tps` / `fps` string slices
#                    of cmd/generate/config/rules/*.go (true-positive examples and curated false positives)
#   trufflehog.json  {"providers": [...], "patterns": [...], "examples": [...]}
#                    providers: the detector package names under pkg/detectors/; patterns: the regular expressions
#                    compiled from a single string literal in detector code; examples: credential-shaped string
#                    literals of the detectors' tests
#
# Licences: gitleaks is MIT; trufflehog is AGPL-3.0. Only data derived from their files is used (formats, keywords,
# example strings), never their code. Both are pinned by the commit of a release tag.
schema: 1
kind: source
name: secret-catalogs
description: Credential formats, keywords and examples taken from the gitleaks and trufflehog sources.
output: catalogs/
builder: build_secret_catalogs.py
build:
  example_length: {min: 16, max: 200}
entries:
  - id: gitleaks
    type: git
    url: https://github.com/gitleaks/gitleaks
    pin: {commit: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e}     # tag v8.30.1
    licence: MIT
    take: {include: ["config/gitleaks.toml", "cmd/generate/config/rules/*.go"], blob_limit: 1048576}
  - id: trufflehog
    type: git
    url: https://github.com/trufflesecurity/trufflehog
    pin: {commit: 64d939a56362f519781c53ea09b27f8d1dc0140a}     # tag v3.97.6
    licence: AGPL-3.0-only
    take: {include: ["pkg/detectors/**/*.go"], blob_limit: 262144}
