# Real binaries: the CONTEXT bytes the secrets-bin generator plants synthetic credentials into. Built by
# `python data/build_binary_corpus.py` into $PUREBYTE_DATA/corpora/binary-context.bin (+ .manifest.json,
# .index.tsv.gz). Schema: data/README.md.
#
# Every artifact is public and pinned by sha256 (and version): Debian 13 packages (snapshot.debian.org by file hash,
# deb.debian.org as mirror; sha256 from the Debian archive), PyPI wheels (sha256 from PyPI), the Go and Python Windows
# distributions (sha256 published by go.dev / in python.org's Sigstore bundles), Git for Windows, 7-Zip and tree-sitter
# release assets (sha256 digests of the GitHub releases), and Maven Central jars (sha256 of the artifacts, checked
# against Maven Central's published SHA-1). `licence` is the artifact's main licence; for Debian packages the build
# manifest also records the License fields of each package's copyright file.
#
# Formats: ELF (x86-64, aarch64, armhf; executables, shared objects, relocatable objects), static libraries (ar),
# Python bytecode (.pyc of CPython 3.12 and 3.13), PE (Windows x86, x86-64 and ARM64 executables and DLLs), Mach-O
# (arm64 and x86-64), Java (jars and class files), WebAssembly, firmware images (BIOS/UEFI, network boot ROMs,
# bootloaders, Wi-Fi firmware).
#
# Windows system files (the obvious "real PE" source) are not redistributable and are NOT used: open-source Windows
# builds (Git for Windows, Python, Go, 7-Zip, PyPI wheels, pywin32, native libraries inside jars) stand in for them.
# None of these artifacts is an evaluation file (identity check on package+version, URL and sha256; content check on
# 64-byte blocks when the corpus is built).
schema: 1
kind: source
name: binary-context
description: Real binaries in many formats (ELF, ar, pyc, PE, Mach-O, Java, WebAssembly, firmware), the context of the
  secrets-bin generator.
output: corpora/binary-context.bin
builder: build_binary_corpus.py
build:
  target_mib: 300
  seed: 0
  member_bytes: {min: 8192, max: 67108864}   # a member outside this range is not a candidate
  group_member_min: {pyc: 2048, java: 2048, wasm: 4096, firmware: 4096}
  span: {max: 262144, min: 4096}             # each file contributes ONE contiguous span (never spliced)
  symbols: {min_count: 300}                  # an ELF with this many C++ symbol names joins elf_symbols
  tolerance: 0.03
  decile_tolerance: 0.05
  groups:                                    # declared shares (sum 1) and distinct files required
    elf:         {share: 0.45, min_files: 400}
    elf_symbols: {share: 0.08, min_files: 60}
    ar:          {share: 0.07, min_files: 40}
    pyc:         {share: 0.08, min_files: 400}
    pe:          {share: 0.17, min_files: 300}
    macho:       {share: 0.08, min_files: 100}
    java:        {share: 0.04, min_files: 100}
    wasm:        {share: 0.01, min_files: 8}
    firmware:    {share: 0.02, min_files: 10}
