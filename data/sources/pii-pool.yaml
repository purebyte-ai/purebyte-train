# The release pool of the pii specialist: labelled documents of the TRAIN splits of four public PII datasets, with the
# hard overlap check against every PII evaluation set (build_pii_pool.py, pbdata/pii_pool.py, data/README.md "The PII
# pool").
#
#   python data/build_pii_pool.py   -> $PUREBYTE_DATA/pii/public_train_xl/*.jsonl (387,391 documents, 23 languages)
#                                      $PUREBYTE_DATA/pii/public_train_clean/base_public_train.jsonl (32,500)
#
# The four files are downloaded whole at the pinned revision and verified by sha256 (3.9 GB, 3.7 of them the OpenPII-1M
# TRAIN file). TRAIN splits only; their test and validation splits are evaluation material (data/exams/pii.yaml), and
# the PII masking benchmark (CC BY-NC) is never training material. Not used either: the ai4privacy 200k / 300k / 400k /
# open-500k sets (licences) and privy (the benchmark's privy test is a fork of it).
#
# `build.reference_sha256`: the sha256 of each output file (one JSON document per line, LF line ends) of the pool the
# release was trained with. A build with the default options gives exactly these files, and says so in its manifest.
#
# Attribution required by the licences: "Ai4Privacy / Ai Suisse SA OpenPII-1M, CC BY 4.0"; "NVIDIA Nemotron-PII,
# CC BY 4.0"; "Gretel.ai datasets, Apache 2.0".
schema: 1
kind: source
name: pii-pool
description: The release pool of the pii specialist - labelled public TRAIN documents in 23 languages, overlap-checked.
output: pii/public_train_xl/
builder: build_pii_pool.py
build:
  base_manifest: pii.yaml          # its sample (hf entries), drawn from the files below and checked by its reference
  base_per_source: 12000
  openpii: {en: 48000, per_language: 7000, oversample: 2.5}
  min_unit: 40                     # characters of a normalised sentence or line (the exact-unit level)
  min_masked_unit: 60              # characters of a masked unit holding a placeholder (the masked-unit level)
  evaluation_sets: [piimb, pii-bench-test, pii-bench-dev]
  # The documents that the maintainers' own evaluation set (2,000 documents built from their code corpus; not public)
  # excluded at the exact-unit level, by id and the key of their normalised text (pbdata/pii_pool.py `text_key`): the
  # public build leaves them out too (reason `listed`), and so gives the release pool without that set.
  listed_exclusions:
    - {id: Nemotron-PII-train-17574, key: cdbd07cf32b07e93}
    - {id: Nemotron-PII-train-59492, key: a76da572067d5326}
    - {id: Nemotron-PII-train-uid-a1f39f0ee68c4fa392f78e6b31e3dff5, key: b1428fc4b31ed71b}
