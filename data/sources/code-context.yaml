# Real source code and configuration text: the CONTEXT bytes the secrets-code generator injects synthetic credentials
# into. Built by `python data/build_code_corpus.py` into $PUREBYTE_DATA/corpora/code-context.bin (+ .manifest.json,
# .index.tsv.gz). Schema: data/README.md.
#
# Selection of repositories: permissively licensed, active, public; spread over the languages and configuration formats
# a secrets scanner meets; none of them is an evaluation repository (data/exams/*.yaml): the identity check refuses the
# build otherwise. Commits are the default-branch heads of 2026-09-23. Only files up to `file_bytes.max` are ever
# downloaded (partial clone), and they are read from git objects, never from a checkout.
schema: 1
kind: source
name: code-context
description: Mixed-language source code and configuration files (text), the context of the secrets-code generator.
output: corpora/code-context.bin
builder: build_code_corpus.py
build:
  target_mib: 300                 # 300 x 2^20 bytes
  seed: 0
  file_bytes: {min: 64, max: 524288}
  max_nul_bytes: 2                # a file with more NUL bytes is binary, whatever its extension
  tolerance: 0.03                 # |real share - declared share| per group
  decile_tolerance: 0.03          # every byte-decile keeps the global mix
  min_files: 400                  # distinct files per group: a shape is learned from many files, not from bytes
  skip_dirs: [.git, node_modules, vendor, _vendor, third_party, third-party, dist, build, target, __pycache__,
              .venv, venv, .tox, site-packages, .next]
  groups:                         # declared shares (sum 1); a file joins the first group whose names/extensions match
    python:     {share: 0.14,  ext: [.py]}
    js_ts:      {share: 0.14,  ext: [.js, .jsx, .ts, .tsx, .mjs, .cjs]}
    java_kt:    {share: 0.09,  ext: [.java, .kt, .kts, .gradle, .scala]}
    go_rust:    {share: 0.09,  ext: [.go, .rs]}
    ruby_php:   {share: 0.07,  ext: [.rb, .php]}
    c_cpp:      {share: 0.06,  ext: [.c, .h, .cc, .cpp, .hpp]}
    csharp:     {share: 0.035, ext: [.cs]}
    yaml_ci:    {share: 0.11,  ext: [.yml, .yaml], names: [Jenkinsfile, .gitlab-ci.yml]}
    config:     {share: 0.05,  ext: [.properties, .toml, .ini, .cfg, .conf, .env], names: [Procfile, .npmrc, .env]}
    shell:      {share: 0.05,  ext: [.sh, .bash, .zsh, .fish], names: [Makefile]}
    infra:      {share: 0.025, ext: [.tf, .tfvars, .dockerfile, .nomad, .hcl], names: [Dockerfile, Vagrantfile]}
    data:       {share: 0.04,  ext: [.json, .xml]}
    sql:        {share: 0.01,  ext: [.sql]}
    powershell: {share: 0.015, ext: [.ps1, .psm1, .psd1]}
    swift:      {share: 0.01,  ext: [.swift]}
    lua:        {share: 0.015, ext: [.lua]}
    perl:       {share: 0.01,  ext: [.pl, .pm, .t]}
    dart:       {share: 0.01,  ext: [.dart]}
    elixir:     {share: 0.02,  ext: [.ex, .exs]}
    groovy:     {share: 0.01,  ext: [.groovy, .gvy]}
