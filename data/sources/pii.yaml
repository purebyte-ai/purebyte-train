# Training resources of the PII specialist: public name / place / sentence lists and public TRAIN documents.
#
#   python data/fetch_pii.py lists     -> $PUREBYTE_DATA/pii/lists/*.tsv + LICENSES.md + SHA256.json
#   python data/fetch_pii.py train     -> $PUREBYTE_DATA/pii/public_train/<source>.jsonl + MANIFEST.json
#
# No list holds personal data: they are frequency lists of given names and surnames, a street map, a gazetteer and
# sentences written by volunteers. The generator composes SYNTHETIC people from them. The TRAIN documents are synthetic
# PII datasets; only their train splits are used (their test / validation splits are evaluation material, see
# data/exams/pii.yaml, and the identity check refuses a source that uses one).
#
# Upstream files that are replaced in place by their publishers (the INE tables, the Tatoeba exports) are pinned by the
# sha256 of the copy the released models were built from. When the publisher has replaced a file, the download stops
# with a sha256 mismatch; `fetch_pii.py lists --accept-upstream-change` then uses the current file and writes the new
# digest into the build manifest as a deviation, and `--skip-sentences` builds every list but the two Tatoeba ones
# (which only the prose and e-mail scenes read). No mirror of the pinned copies exists yet (data/README.md).
#
# `reference_sha256` of a TRAIN source: the sha256 of its sample as the build writes it (one JSON document per line,
# LF line ends) BEFORE the exclusion step; the sample the released models were built from. build_pii_pool.py draws the
# same samples from the pinned files of data/sources/pii-pool.yaml and checks them against these digests.
#
# Attribution required by the licences (carry it into model cards): "Contains data from the Instituto Nacional de
# Estadistica (INE), www.ine.es, CC BY 4.0"; "Sentences from Tatoeba (tatoeba.org), CC BY 2.0 FR"; "Ai4Privacy /
# Ai Suisse SA OpenPII-1M, CC BY 4.0"; "NVIDIA Nemotron-PII, CC BY 4.0"; "Gretel.ai datasets, Apache 2.0".
schema: 1
kind: source
name: pii
description: Public lists (names, surnames, streets, places, sentences) and public TRAIN documents for the PII specialist.
output: pii/
builder: fetch_pii.py
build:
  seed: 0
  streets_kept: 80000
  sentences_kept: 150000
  sentences_safe_first_names: 4000
  train_documents_per_source: 12000
